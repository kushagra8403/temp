<!doctype html>
<html lang="en" data-industry="saas">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Build a Billion-Dollar Company</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Instrument+Sans:wght@400;500;600&family=Spectral:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a founder's ledger. A sticky ledger strip on top, tabbed working pages below,
   and two small characters anchoring opposite bottom corners.
   Each industry re-tints the whole ledger; colors stay muted and paper-like. */
:root {
  --paper: #edf1f2; --surface: #f8fafa; --raised: #ffffff; --ink: #1c2a30; --muted: #5b6b72; --line: #d2dbde;
  --accent: #3d6c79; --accent-ink: #ffffff; --accent-soft: #dce7ea; --second: #8a7356;
  --good: #4a7656; --good-soft: #e1ece3; --warn: #9a7533; --warn-soft: #f2e9d6; --bad: #9c524b; --bad-soft: #f3e2df;
  --shadow: 0 1px 2px rgba(20, 30, 35, .06), 0 6px 20px rgba(20, 30, 35, .07);
  --f-display: 'Young Serif', 'Iowan Old Style', Georgia, serif;
  --f-ui: 'Instrument Sans', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --f-prose: 'Spectral', 'Iowan Old Style', Georgia, serif;
  --f-num: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --r: 10px; --r-sm: 7px;
  color-scheme: light;
}
:root[data-industry="fintech"] { --paper: #edefe9; --surface: #f8f9f5; --ink: #1d2a22; --muted: #5a685e; --line: #d3d9cf; --accent: #3e6650; --accent-soft: #dde8e0; --second: #9a7d45; }
:root[data-industry="consumer"] { --paper: #f2edef; --surface: #fbf8f9; --ink: #2c1f27; --muted: #6c5a64; --line: #e1d5da; --accent: #87536d; --accent-soft: #efdfe7; --second: #4e7787; }
:root[data-industry="ecommerce"] { --paper: #f0ede5; --surface: #faf8f3; --ink: #2a251c; --muted: #696152; --line: #dfd7c8; --accent: #8c6630; --accent-soft: #efe4cf; --second: #4d6d5b; }
:root[data-industry="hardware"] { --paper: #e9eaeb; --surface: #f6f6f6; --ink: #22262b; --muted: #5d636a; --line: #d3d6d9; --accent: #4c5a6b; --accent-soft: #dde2e8; --second: #a1733a; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { min-height: 100%; }
body { margin: 0; background: var(--paper); color: var(--ink); font: 15px/1.5 var(--f-ui); -webkit-font-smoothing: antialiased; transition: background-color .4s ease; }
body.modal-open { overflow: hidden; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 400; text-wrap: balance; margin: 0; letter-spacing: -.005em; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.muted { color: var(--muted); }
.num, .tb-stats dd, .kv dd, .quote dd, .data td.num { font-family: var(--f-num); font-variant-numeric: tabular-nums; }
.eyebrow { font-size: 12px; letter-spacing: .09em; text-transform: uppercase; color: var(--accent); font-weight: 600; margin: 0 0 8px; }
.prose { font-family: var(--f-prose); font-size: 17px; line-height: 1.55; max-width: 62ch; margin: 0 0 14px; }
.fine { font-size: 13px; color: var(--muted); margin: 10px 0 0; max-width: 70ch; }
.quiet { color: var(--muted); font-family: var(--f-prose); font-style: italic; font-size: 16px; margin: 0; }
.link { background: none; border: 0; padding: 0; color: var(--accent); font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; font-size: inherit; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 1px solid var(--line); background: var(--raised); color: var(--ink); padding: 8px 14px; border-radius: var(--r-sm); font-weight: 600; font-size: 14px; cursor: pointer; transition: background-color .15s, border-color .15s, transform .1s; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--accent); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.07); }
.btn.ghost { background: transparent; }
.btn.small { padding: 5px 10px; font-size: 13px; }
.btn.big { padding: 12px 22px; font-size: 16px; }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.danger-text { color: var(--bad); }
select { border: 1px solid var(--line); background: var(--raised); border-radius: var(--r-sm); padding: 5px 8px; font-size: 13px; max-width: 100%; }
input[type="range"] { width: 100%; accent-color: var(--accent); }

/* Pills */
.pill { display: inline-flex; align-items: center; gap: 4px; padding: 2px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--accent-soft); color: var(--ink); border: 1px solid transparent; white-space: nowrap; }
.pill.good { background: var(--good-soft); color: var(--good); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.accent { background: var(--accent); color: var(--accent-ink); }
.pill.unknown { background: transparent; border: 1px dashed var(--muted); color: var(--muted); }
.pill.tier-star { background: var(--ink); color: var(--paper); }
.pill.tier-strong { background: var(--accent); color: var(--accent-ink); }
.pill.tier-solid { background: var(--accent-soft); color: var(--ink); }
.pill.tier-struggling { background: var(--warn-soft); color: var(--warn); }
.pill.tier-under { background: var(--bad-soft); color: var(--bad); }

/* ---------- Setup ---------- */
/* Top-anchored centering: margin:auto inside a scrollable flex container, so a tall form never spills off the top. */
.setup-scroll { min-height: 100vh; display: flex; overflow-y: auto; padding-block: 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.setup { margin: auto; width: 100%; max-width: 980px; display: grid; gap: 18px; }
.setup-head h1 { font-size: clamp(30px, 5vw, 46px); line-height: 1.08; }
.setup-head .lede { font-family: var(--f-prose); font-size: 17px; color: var(--muted); margin: 8px 0 0; max-width: 60ch; }
.field { display: grid; gap: 7px; }
.field > label, .label { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.name-row { display: flex; gap: 8px; }
.name-row input { flex: 1; min-width: 0; border: 1px solid var(--line); background: var(--raised); border-radius: var(--r-sm); padding: 9px 12px; font-size: 16px; font-family: var(--f-display); }
.industry-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
.industry-card { text-align: left; display: grid; gap: 6px; align-content: start; padding: 12px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); cursor: pointer; transition: border-color .15s, background-color .3s, box-shadow .15s; }
.industry-card:hover { border-color: var(--accent); }
.industry-card.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); background: var(--raised); }
.ic-top { display: flex; align-items: center; gap: 8px; }
.ic-name { font-family: var(--f-display); font-size: 17px; }
.ic-blurb { font-size: 12.5px; color: var(--muted); line-height: 1.4; }
.ic-stats { display: flex; flex-wrap: wrap; gap: 4px 8px; font-family: var(--f-num); font-size: 11px; color: var(--muted); }
.setup-row { display: grid; grid-template-columns: 1fr 1.6fr; gap: 18px; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: var(--r-sm); overflow: hidden; background: var(--surface); width: fit-content; max-width: 100%; }
.seg button { border: 0; background: transparent; padding: 7px 14px; cursor: pointer; font-weight: 600; font-size: 14px; color: var(--muted); border-right: 1px solid var(--line); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--accent); color: var(--accent-ink); }
.seg.small button { padding: 5px 11px; font-size: 13px; }
.hint { margin: 0; font-size: 13.5px; color: var(--muted); max-width: 62ch; }
.setup-foot { display: flex; align-items: center; justify-content: space-between; gap: 18px; padding-top: 14px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.setup-sum { margin: 0; font-size: 14px; color: var(--muted); max-width: 64ch; flex: 1 1 320px; }
.setup-sum strong { color: var(--ink); }

/* ---------- Game shell ---------- */
.game { min-height: 100vh; padding-bottom: 150px; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); display: grid; grid-template-columns: minmax(150px, 1.1fr) minmax(180px, 1fr) auto auto; gap: 18px; align-items: center; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.tb-brand { min-width: 0; }
.tb-name { font-family: var(--f-display); font-size: 21px; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tb-meta { font-size: 12px; color: var(--muted); }
.tb-clock { display: grid; gap: 5px; min-width: 0; }
.tb-clock-row { display: flex; gap: 10px; align-items: center; font-size: 13px; flex-wrap: wrap; }
.tb-clock-row span { color: var(--muted); }
.clock-bar { position: relative; height: 6px; border-radius: 3px; background: var(--accent-soft); overflow: hidden; }
.clock-fill { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 3px; transition: width .5s ease; }
.clock-rec { position: absolute; top: 0; bottom: 0; background: var(--bad); opacity: .55; }
.tb-stats { display: flex; gap: 18px; margin: 0; }
.tb-stats div { display: grid; }
.tb-stats dt { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.tb-stats dd { margin: 0; font-size: 15px; font-weight: 500; }
.neg { color: var(--bad) !important; } .warn { color: var(--warn) !important; } .pos { color: var(--good) !important; }
.advance { padding: 11px 18px; font-size: 15px; }
.tabs { display: flex; gap: 2px; overflow-x: auto; border-bottom: 1px solid var(--line); background: var(--paper); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); scrollbar-width: none; }
.tab { border: 0; background: none; padding: 12px 14px 10px; font-weight: 600; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; display: inline-flex; gap: 6px; align-items: center; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab.on { color: var(--ink); border-bottom-color: var(--accent); }
.tab-badge { background: var(--warn); color: #fff; font-size: 11px; border-radius: 999px; padding: 0 6px; line-height: 17px; }
.tab-count { font-family: var(--f-num); font-size: 12px; color: var(--muted); }
.tab-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.tab-body { max-width: 1240px; margin: 0 auto; padding-block: 20px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 16px; }
.ov-grid { display: grid; grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.col { display: grid; gap: 16px; min-width: 0; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; min-width: 0; }
.panel-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.panel-head h2 { font-size: 19px; }
.panel-head .muted { font-size: 13px; }

/* Events */
.event { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 12px 14px; background: var(--raised); display: grid; gap: 8px; }
.event + .event { margin-top: 10px; }
.event.warn { border-color: color-mix(in srgb, var(--warn) 45%, var(--line)); background: color-mix(in srgb, var(--warn-soft) 55%, var(--raised)); }
.event p { margin: 0; font-family: var(--f-prose); font-size: 16px; }
.event-kind { font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; color: var(--muted); }
.event-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.event-note { font-size: 12.5px; color: var(--muted); }

/* Statement & kv */
.statement { width: 100%; border-collapse: collapse; font-size: 14px; }
.statement th { text-align: left; font-weight: 400; padding: 5px 0; color: var(--muted); }
.statement td { text-align: right; font-family: var(--f-num); padding: 5px 0; font-variant-numeric: tabular-nums; }
.statement tr.sub th, .statement tr.sub td { color: var(--ink); border-top: 1px solid var(--line); }
.statement tr.total th, .statement tr.total td { color: var(--ink); font-weight: 600; border-top: 1px solid var(--ink); }
.kv { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px; margin: 0; }
.kv div { display: grid; gap: 1px; min-width: 0; }
.kv dt { font-size: 12px; color: var(--muted); }
.kv dd { margin: 0; font-size: 15px; }
.goal { display: grid; gap: 6px; }
.goal + .goal { margin-top: 12px; }
.goal-row { display: flex; justify-content: space-between; gap: 10px; font-size: 13.5px; flex-wrap: wrap; }
.meter { height: 8px; background: var(--accent-soft); border-radius: 4px; overflow: hidden; }
.meter span { display: block; height: 100%; background: var(--accent); border-radius: 4px; transition: width .5s ease; }
.meter.alt span { background: var(--second); }

/* Charts */
.chart { width: 100%; height: auto; display: block; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .grid.zero { stroke: var(--muted); stroke-opacity: .5; }
.chart .tick { fill: var(--muted); font-family: var(--f-num); font-size: 10.5px; }
.chart .line { fill: none; stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { opacity: .12; }
.chart .rec-band { fill: var(--bad); opacity: .08; }
.chart .dot { stroke: var(--surface); stroke-width: 2; }
.chart-empty { color: var(--muted); font-style: italic; font-family: var(--f-prose); padding: 26px 0; text-align: center; }
.legend { display: inline-flex; gap: 10px; align-items: center; font-size: 12.5px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; margin-right: -4px; }
.spark { display: block; } .spark path { fill: none; stroke: var(--accent); stroke-width: 1.6; }
.spark-empty { color: var(--muted); }

/* Team */
.hire-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.hire-card { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 12px; display: grid; gap: 6px; align-content: start; background: var(--raised); }
.hire-name { font-family: var(--f-display); font-size: 16px; }
.hire-role { font-size: 13px; color: var(--muted); }
.hire-cost { font-family: var(--f-num); font-size: 12px; color: var(--muted); }
.hire-card .btn { justify-self: start; }
.team-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 13.5px; }
.emp-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
.emp { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; display: grid; gap: 9px; align-content: start; min-width: 0; }
.emp.is-rough { border-color: color-mix(in srgb, var(--bad) 35%, var(--line)); }
.emp-head { display: flex; justify-content: space-between; gap: 10px; }
.emp-name { font-size: 18px; line-height: 1.2; }
.emp-sub { font-size: 12.5px; color: var(--muted); }
.emp-out { display: grid; text-align: right; font-size: 11px; color: var(--muted); }
.emp-out .num { font-size: 16px; color: var(--ink); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.k { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-right: 4px; }
.emp-skill, .emp-sales { font-size: 13.5px; display: grid; gap: 6px; }
.emp-skill { display: block; }
.emp-market { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.emp-risk { display: flex; align-items: center; gap: 8px; font-size: 12.5px; flex-wrap: wrap; }
.risk-meter { width: 70px; height: 6px; background: var(--accent-soft); border-radius: 3px; overflow: hidden; }
.risk-meter span { display: block; height: 100%; background: var(--good); }
.risk-meter.r-watch span { background: var(--warn); } .risk-meter.r-high span { background: var(--bad); }
.risk-label { font-weight: 600; } .risk-label.r-low { color: var(--good); } .risk-label.r-watch { color: var(--warn); } .risk-label.r-high { color: var(--bad); }
.emp-request { font-size: 13px; background: var(--accent-soft); border-radius: var(--r-sm); padding: 6px 9px; }
.emp-hist { list-style: none; margin: 0; padding: 8px 0 0; border-top: 1px dashed var(--line); display: grid; gap: 3px; font-family: var(--f-prose); font-size: 14px; }
.emp-hist .when { font-family: var(--f-num); font-size: 10.5px; color: var(--muted); margin-right: 4px; }
.emp-actions { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.emp-actions select { flex: 1 1 110px; }
.emp-foot { font-size: 12px; font-family: var(--f-num); }
.confirm-row { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; background: var(--good-soft); border-radius: var(--r-sm); padding: 8px 10px; }
.confirm-row.risky { background: var(--warn-soft); }
.confirm-row p { margin: 0; flex: 1 1 100%; font-size: 13px; }

/* Tables */
.table-wrap { overflow-x: auto; }
.data { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.data th { text-align: left; font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.data th.num, .data td.num { text-align: right; }
.data td { padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.data tbody tr:hover { background: var(--accent-soft); }
.data tfoot td { font-weight: 600; }
.data tr.subtotal td { font-weight: 400; color: var(--muted); border-bottom: 0; padding-block: 4px; }
.data tr.grand td { border-top: 1px solid var(--ink); border-bottom: 0; }
.th-btn { background: none; border: 0; padding: 0; font: inherit; color: inherit; letter-spacing: inherit; text-transform: inherit; cursor: pointer; }
.th-btn.on { color: var(--ink); }
.fit-mark { color: var(--good); font-weight: 700; }

/* Product */
.product-hero { display: grid; gap: 14px; }
.ph-version { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
.ph-v { font-family: var(--f-display); font-size: 56px; line-height: 1; color: var(--accent); }
.ph-stage { font-family: var(--f-display); font-size: 22px; }
.ladder { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px 0; }
.ladder li { flex: 1 1 90px; display: grid; gap: 2px; position: relative; padding-top: 14px; font-size: 12px; color: var(--muted); }
.ladder li::before { content: ""; position: absolute; top: 4px; left: 0; right: 0; height: 2px; background: var(--line); }
.ladder li.done::before { background: var(--accent); }
.ladder .dot { position: absolute; top: 0; left: 0; width: 10px; height: 10px; border-radius: 50%; background: var(--surface); border: 2px solid var(--line); }
.ladder li.done .dot { background: var(--accent); border-color: var(--accent); }
.ladder li.cur .lname { color: var(--ink); font-weight: 600; }
.ladder .lat { font-family: var(--f-num); font-size: 10.5px; }
.releases { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-family: var(--f-prose); font-size: 15px; }
.releases li { display: flex; gap: 10px; align-items: baseline; }
.releases .muted { margin-left: auto; font-family: var(--f-ui); font-size: 12px; }

/* Markets */
.market-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
.market-card { border: 1px solid var(--line); border-radius: var(--r-sm); padding: 12px; display: grid; gap: 8px; align-content: start; background: var(--raised); }
.market-card.scout { border-style: dashed; border-color: var(--accent); background: var(--accent-soft); }
.market-card .fine { margin: 0; }
.mc-name { font-family: var(--f-display); font-size: 16px; display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
.mc-stats { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; margin: 0; font-size: 12.5px; }
.mc-stats dt { color: var(--muted); } .mc-stats dd { margin: 0; font-family: var(--f-num); }
.market-card .btn { justify-self: start; }

/* Funding */
.rounds { list-style: none; margin: 0; padding: 0; display: grid; }
.rounds li { display: grid; grid-template-columns: 90px 1fr; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); align-items: center; font-size: 14px; }
.rounds li:last-child { border-bottom: 0; }
.r-name { font-family: var(--f-display); font-size: 15px; }

function stageFor(level) {
  let cur = STAGES[0], next = null;
  for (let i = 0; i < STAGES.length; i++) if (level >= STAGES[i].at) { cur = STAGES[i]; next = STAGES[i + 1] || null; }
  if (!next) { // past the ladder: Legendary I, II, ... every 10 levels
    const n = Math.floor((level - 30) / 10);
    cur = n === 0 ? cur : { at: 30 + n * 10, name: 'Legendary ' + toRoman(n) };
    next = { at: 30 + (n + 1) * 10, name: 'Legendary ' + toRoman(n + 1) };

}

  for (const [v, r] of map) while (n >= v) { s += r; n -= v; }

}

// ---------- Name generation (no repeats within the last ~25 hires) ----------
function genName() {
  const recentF = S.recentFirst.slice(-NAME_MEMORY), recentL = S.recentLast.slice(-NAME_MEMORY);
  let first, last;
  const onTeam = new Set(S.employees.map((e) => e.name));
  const ok = (strict) => !onTeam.has(first + ' ' + last) && !S.usedNames.slice(-NAME_MEMORY * 4).includes(first + ' ' + last) && (!strict || (!recentF.includes(first) && !recentL.includes(last)));
  let found = false;
  for (let i = 0; i < 120 && !found; i++) { first = pick(FIRST_NAMES); last = pick(LAST_NAMES); found = ok(true); }
  for (let i = 0; i < 400 && !found; i++) { first = pick(FIRST_NAMES); last = pick(LAST_NAMES); found = ok(false); }
  S.recentFirst.push(first); S.recentLast.push(last); S.usedNames.push(first + ' ' + last);
  return { first, last };
}
function genCompanyName() { return pick(COMPANY_A) + ' ' + pick(COMPANY_B); }

function rollTier(dist) {
  let r = rand(), acc = 0;
  for (let i = 0; i < TIERS.length; i++) { acc += dist[i]; if (r < acc) return TIERS[i]; }
  return 'solid';
}

// ---------- Employees ----------
function makeEmployee(dept, opts = {}) {
  const { first, last } = genName();
  const skillDept = chance(0.6) ? dept : pick(DEPT_KEYS.filter((d) => d !== dept));
  const skill = pick(DEPTS[skillDept].skills);
  const salary = Math.round(DEPTS[dept].salary * DIF().salary * rr(0.88, 1.12) * wageIndex() / 1000) * 1000;
  const e = {
    id: S.nextId++, first, last, name: `${first} ${last}`, dept, origDept: dept, skill,
    tier: rollTier(HIRE_DIST), revealed: false, hiredTurn: S.turn, deptSince: S.turn, salary,
    temp: null, lastRecog: S.turn, grievance: 0, history: [], dip: 0, lastRaiseTurn: S.turn,
    bonusReadyTurn: S.turn, clapReadyTurn: S.turn, request: null, trait: null, market: null, nativeMarket: null,
  };
  if (dept === 'sales') setupSalesRep(e, opts.market);
  addHistory(e, `Joined ${DEPTS[dept].name}${e.market != null ? ' in ' + marketById(e.market).name : ''}`);
  return e;
}
function setupSalesRep(e, marketId) {
  if (!e.trait) e.trait = chance(0.5) ? 'home' : 'global';
  const m = marketId != null && marketById(marketId) && marketById(marketId).entered ? marketId : homeMarket().id;
  e.market = m;
  if (e.nativeMarket == null) e.nativeMarket = m;
}
function traitMult(e) {
  if (e.dept !== 'sales' || e.market == null) return 1;
  const native = e.market === e.nativeMarket;
  if (e.trait === 'home') return native ? 1.25 : 0.8;
  return native ? 0.95 : 1.15;
}
function traitFitText(e, marketId) {
  const native = marketId === e.nativeMarket;
  const nm = marketById(e.nativeMarket).name;
  if (e.trait === 'home') return native ? { ok: true, text: `Back on home turf in ${nm}. This fits them.` } : { ok: false, text: `A gamble. Home-turf experts tend to struggle away from ${nm}.` };
  return native ? { ok: false, text: `Fine, but globally-minded reps get restless at home.` } : { ok: true, text: `Fits their trait. Globally-minded reps do their best work somewhere new.` };
}

function empOutput(e) {
  let m = TIER_INFO[e.tier].mult;
  if (e.temp) m *= TEMP_INFO[e.temp.type].mult;
  if (isFit(e)) m *= SKILL_FIT_MULT;
  if (S.turn === e.hiredTurn) m *= 0.5; // onboarding quarter
  if (e.dip > 0) m *= 0.75;            // settling after a move
  m *= traitMult(e);
  return m;
}

function flightRisk(e) {
  if (tenure(e) < 2) return 3;
  const since = quartersSinceRecog(e);
  let r = 5 + Math.min(27, Math.max(0, since - 2) * 3);
  r += { star: 14, strong: 7, solid: 2, struggling: 0, under: -2 }[e.tier];
  if (e.temp && e.temp.type === 'rough') r += 8;
  if (e.temp && e.temp.type === 'motivated') r -= 12;
  if (e.temp && e.temp.type === 'hot') r -= 4;
  r += e.grievance;
  if (S.turn - e.lastRaiseTurn > 12) r += 5;
  return clamp(Math.round(r), 0, 95);
}
const riskLabel = (r) => (r >= 35 ? 'High' : r >= 20 ? 'Watch' : 'Low');

function hire(dept, marketId) {
  const e = makeEmployee(dept, { market: marketId });
  spend(hireFee(e.salary), `Recruiting ${e.name}`);
  S.employees.push(e);
  S.stats.hires++;
  news(`${e.name} joins ${DEPTS[dept].name}${e.market != null ? ' covering ' + marketById(e.market).name : ''}. Tier unknown until their first quarter is in.`, 'hire');
  return e;
}

function removeEmployee(e, how) {
  S.employees = S.employees.filter((x) => x.id !== e.id);
  S.events = S.events.filter((ev) => ev.empId !== e.id);
  S.former.push({ name: e.name, tier: e.tier, dept: e.dept, how, turn: S.turn });
  // A strong ex-employee may land at the rival, which makes them tougher to compete with.
  if ((e.tier === 'star' || e.tier === 'strong') && chance(e.tier === 'star' ? 0.55 : 0.4)) {
    const bump = e.tier === 'star' ? 0.04 : 0.025;
    S.rival.strength = Math.min(0.25, S.rival.strength + bump);
    S.rival.alumni.push(e.name);
    S.stats.toRival++;
    news(`${e.name} has signed with ${S.rival.name}. Expect them to be a little harder to beat.`, 'rival');
    S.rival.pending.push({ turn: S.turn + ri(2, 5), name: e.name, dept: e.dept });
  }
}

function fire(e) {
  spend(severance(e), `Severance for ${e.name}`);
  S.stats.fires++;
  const label = e.revealed ? TIER_INFO[e.tier].label.toLowerCase() : 'unproven';
  news(`${e.name} (${label}, ${DEPTS[e.dept].name}) has been let go.`, 'depart');
  removeEmployee(e, 'fired');
  S.employees.forEach((x) => { x.grievance = Math.min(20, x.grievance + 2); });
}

function giveBonus(e) {
  const cost = bonusCost(e);
  spend(cost, `Bonus for ${e.name}`);
  e.bonusReadyTurn = S.turn + 2;
  e.lastRecog = S.turn;
  e.grievance = Math.max(0, e.grievance - 6);
  S.stats.bonuses++;
  S.events = S.events.filter((ev) => !(ev.type === 'overlooked' && ev.empId === e.id));
  let msg;
  if (e.temp && e.temp.type === 'rough') {
    if (chance(0.7)) { e.temp = { type: 'motivated', left: 2, reason: 'bonus' }; msg = `${e.first} is out of the rough patch. The bonus landed. Motivated for 2 quarters.`; addHistory(e, 'Bonus pulled them out of a rough patch'); }
    else { msg = `${e.first} appreciated it, but the rough patch hasn't lifted yet.`; addHistory(e, 'Bonus during a rough patch'); }
  } else if (e.temp && e.temp.type === 'hot') {
    e.temp.left += 1; msg = `${e.first} is riding high. The hot streak runs a quarter longer.`; addHistory(e, 'Bonus extended a hot streak');
  } else {
    e.temp = { type: 'motivated', left: 2, reason: 'bonus' }; msg = `${e.first} felt genuinely valued. Motivated for 2 quarters.`; addHistory(e, 'Received a bonus');
  }
  return msg;
}

function giveClap(e) {
  if (S.clapsUsed >= clapBudget()) return null;
  S.clapsUsed++;
  e.clapReadyTurn = S.turn + 3;
  e.lastRecog = S.turn;
  e.grievance = Math.max(0, e.grievance - 2);
  S.stats.claps++;
  S.events = S.events.filter((ev) => !(ev.type === 'overlooked' && ev.empId === e.id));
  let msg;
  if (e.temp && e.temp.type === 'rough') {
    if (chance(0.3)) { e.temp = { type: 'motivated', left: 1, reason: 'clap' }; msg = `A public thank-you was exactly what ${e.first} needed. Rough patch over.`; addHistory(e, 'Public praise lifted a rough patch'); }
    else { msg = `${e.first} smiled, but it'll take more than applause to turn this around.`; addHistory(e, 'Applauded during a rough patch'); }
  } else if (!e.temp && chance(0.4)) {
    e.temp = { type: 'motivated', left: 1, reason: 'clap' }; msg = `${e.first} lit up. Motivated for a quarter.`; addHistory(e, 'Applauded at all-hands');
  } else { msg = `${e.first} appreciated the shout-out.`; addHistory(e, 'Applauded at all-hands'); }
  return msg;
}

// Transfer: a real gamble with a fresh performance roll, hidden until next quarter.
function transferOdds(e, dept) {
  const fit = SKILLS[e.skill].dept === dept;
  const dist = fit ? [0.18, 0.30, 0.34, 0.12, 0.06] : [0.08, 0.20, 0.40, 0.20, 0.12];
  const keep = tierIdx(e.tier) <= 2 ? 1 : 0;
  const good = 0.4 * keep + 0.6 * (dist[0] + dist[1] + dist[2]);
  return { fit, dist, good };
}
function transfer(e, dept, initiatedBy = 'you') {
  if (dept === e.dept) return;
  const { dist } = transferOdds(e, dept);
  const from = e.dept;
  e.prevTier = e.tier;
  if (!chance(0.4)) e.tier = rollTier(dist);
  e.dept = dept; e.deptSince = S.turn; e.revealed = false; e.dip = 1;
  if (e.temp && e.temp.type !== 'motivated') e.temp = null;
  if (dept === 'sales') setupSalesRep(e, homeMarket().id); else e.market = null;
  e.request = null;
  S.events = S.events.filter((ev) => !(ev.type === 'transfer' && ev.empId === e.id));
  S.stats.transfers++;
  addHistory(e, `Transferred ${DEPTS[from].short} → ${DEPTS[dept].short}${initiatedBy === 'request' ? ' (their request)' : ''}`);
  news(`${e.name} moves from ${DEPTS[from].name} to ${DEPTS[dept].name}. We'll know next quarter whether it suits them.`, 'team');
}
function reassignMarket(e, marketId) {
  if (e.dept !== 'sales' || marketId === e.market) return null;
  const fit = traitFitText(e, marketId);
  e.market = marketId; e.dip = 1;
  addHistory(e, `Reassigned to ${marketById(marketId).name}`);
  S.stats.reassigns++;
  return fit;
}

// ---------- Markets ----------
function makeMarket(def, idx) {
  return {

    home: !!def.home, scouted: !!def.scouted, entered: !!def.home, enteredTurn: def.home ? 0 : null,
    customers: 0, revenue: 0, newCust: 0, churned: 0, lastSpend: 0, hist: [], profitHist: [],
  };
}
function marketRamp(m) {
  const q = S.turn - m.enteredTurn;
  return q <= 0 ? 0.5 : q === 1 ? 0.8 : 1;
}
function enterMarket(m) {
  if (m.entered) return;
  spend(m.entry, `Entering ${m.name}`);
  m.entered = true; m.enteredTurn = S.turn;
  S.stats.marketsEntered++;

}
function scoutMarket() {
  const cost = scoutCost();
  spend(cost, 'Scouting a new market');
  S.scoutCount++;
  let name;
  for (let i = 0; i < 60; i++) { name = `The ${pick(SCOUT_ADJ)} ${pick(SCOUT_NOUN)}`; if (!S.markets.some((m) => m.name === name)) break; }
  if (S.markets.some((m) => m.name === name)) name = `${name} ${S.scoutCount + 1}`;
  const t = rand(); // 0 = frontier, 1 = mature
  const arpu = Math.round((0.25 + 0.85 * t) * 100) / 100;
  const growth = Math.round(clamp(1.75 - 0.95 * t + rr(-0.1, 0.1), 0.6, 1.85) * 100) / 100;
  const size = Math.round(rr(0.15, 0.7) * 100) / 100;
  const def = {
    name, size, growth, arpu, scouted: true,
    entry: Math.round((40000 + 160000 * arpu * size + rr(0, 30000)) / 5000) * 5000,
    overhead: Math.round((5000 + 15000 * arpu * (0.6 + size)) / 500) * 500,
  };
  const m = makeMarket(def, S.markets.length);
  S.markets.push(m);
  news(`Scouts report back on ${name}: ${t < 0.4 ? 'a frontier market, cheap to win and quick to grow, with low prices' : t < 0.7 ? 'a balanced market with fair prices and steady demand' : 'a mature market where customers pay well but growth is slow'}.`, 'market');
  return m;
}
function marketStatus(m) {
  if (!m.entered) return null;
  if (S.turn - m.enteredTurn < 3) return { key: 'new', label: 'Ramping up' };
  const recent = m.profitHist.slice(-3);
  if (recent.length >= 3 && recent.every((p) => p < 0)) return { key: 'bad', label: 'Struggling' };
  const h = m.hist; const g = h.length >= 3 ? h[h.length - 1] / Math.max(1, h[h.length - 3]) - 1 : 0;
  if (g > 0.15) return { key: 'good', label: 'Thriving' };
  return { key: 'ok', label: 'Steady' };
}

// ---------- Financial projections ----------
function payrollQ() { return sum(S.employees, (e) => e.salary) / 4; }
function opsStrain() {
  const ops = S.employees.filter((e) => e.dept === 'ops');
  const opsOut = sum(ops, (e) => TIER_INFO[e.tier].mult);
  const nonOps = S.employees.length - ops.length;
  const ratio = nonOps / (opsOut * 8 + 6);
  return clamp(1 + 0.15 * (ratio - 1), 1, 1.5);
}
function overheadQ() {
  const base = 18000 + 5000 * S.employees.length + sum(enteredMarkets(), (m) => m.overhead) + IND().compliance;
  return base * DIF().overhead * opsStrain() * wageIndex();
}
function projectedNet() {
  const rev = sum(enteredMarkets(), (m) => m.customers * marketARPU(m) * 3);
  const gp = rev * IND().margin;
  return gp - payrollQ() - overheadQ() - S.marketingSpend;
}
function runwayMonths() {
  const net = projectedNet();
  if (net >= 0) return Infinity;
  return Math.max(0, S.cash) / (-net / 3);
}

// ---------- Valuation ----------
function arrGrowthYoY() {
  const h = S.history; const now = currentARR();
  const prior = h.length >= 4 ? h[h.length - 4].arr : 0;
  if (prior < 50000) return now > 0 ? 1 : 0;
  return clamp(now / prior - 1, -0.5, 3);
}
function computeValuation() {
  const ind = IND(); const arr = currentARR(); const rec = recessionNow();
  const g = arrGrowthYoY();
  const gf = clamp(0.6 + 0.5 * g, 0.4, 1.6);
  const pf = Math.min(1.5, 1 + 0.025 * (S.product.level - 1));
  const recF = rec ? 1 - 0.4 * rec.sev : 1;
  const revVal = arr * ind.multiple * gf * pf * S.sentiment * recF;
  const fallback = 1.5e6 + Math.max(0, S.cash) + S.product.level * 350000 + S.employees.length * 60000;
  const fade = clamp(1 - arr / 3e6, 0, 1);
  return Math.max(revVal, fallback * fade, Math.max(0, S.cash) * 0.8, 250000);
}

// ---------- Funding ----------
function roundUnlockTurn(r) {
  if (r.key === 'seed') return r.t5;
  const t = Math.round(r.t5 * Math.pow(S.totalTurns / 20, 0.6));
  return r.key === 'a' ? Math.min(t, 8) : t;
}
function roundARRNeed(r) { return r.arrAbs != null ? r.arrAbs : r.arrFrac * HOR().ipoARR * Math.min(IND().ipoMult, 1.3); }
function roundStatus() {
  const r = ROUNDS[S.funding.next];
  if (!r) return { state: 'done' };
  const unlock = roundUnlockTurn(r), need = roundARRNeed(r);
  if (S.turn < unlock) return { state: 'locked', r, why: `Opens in Year ${yearOf(unlock)}, Q${quarterOf(unlock)}`, unlock, need };
  if (currentARR() < need) return { state: 'locked', r, why: `Needs ${fmtMoney(need)} ARR`, unlock, need };
  if (S.turn < S.funding.cooldownUntil) return { state: 'cooldown', r, why: `Investors will take meetings again in ${S.funding.cooldownUntil - S.turn} quarter${S.funding.cooldownUntil - S.turn > 1 ? 's' : ''}`, unlock, need };
  return { state: 'open', r, unlock, need };
}
function fundingTerms(r) {
  const scale = r.key === 'seed' || r.key === 'a' ? 1 : HOR().ipoARR / 100e6;
  const preBasis = Math.max(r.floor * IND().floorMult * scale, computeValuation() * 1.1);
  const mid = (r.eq[0] + r.eq[1]) / 2;
  const fair = clamp(mid / S.sentiment, r.eq[0], r.eq[1]);
  const baseCheck = preBasis * fair / (1 - fair);
  return { preBasis, fair, baseCheck, min: r.eq[0] * 0.5, max: Math.min(0.4, r.eq[1] * 1.3) };
}
function fundingQuote(terms, eq) {
  const cash = terms.baseCheck * Math.sqrt(eq / terms.fair);
  const post = cash / eq;
  return { eq, cash, post, pre: post - cash, ownerAfter: S.founderOwnership * (1 - eq) };
}
function closeRound(r, eq, cash) {
  const investor = pick(INVESTORS[r.key]);
  S.cash += cash;
  S.founderOwnership *= 1 - eq;
  S.capTable.forEach((h) => { h.pct *= 1 - eq; });
  S.capTable.push({ name: `${investor} (${r.name})`, pct: eq });
  S.funding.raised.push({ key: r.key, name: r.name, eq, cash, post: cash / eq, turn: S.turn, investor });
  S.funding.next++;
  S.funding.cooldownUntil = S.turn + HOR().roundGap;
  S.stats.raised += cash;
  S.sentiment = clamp(S.sentiment + 0.03, 0.6, 1.4);
  news(`${S.company} closes a ${fmtMoney(cash)} ${r.name} led by ${investor}, at a ${fmtMoney(cash / eq)} post-money valuation.`, 'funding');
}
function walkAwayFromRound() {
  S.funding.cooldownUntil = S.turn + 2;
  S.sentiment = clamp(S.sentiment - 0.04, 0.6, 1.4);
  S.stats.walkedAway++;
}

function ipoStatus() {
  const need = ipoARRRequired();
  const minTurn = Math.round(S.totalTurns * 0.3);
  const checks = [
    { ok: currentARR() >= need, text: `ARR of at least ${fmtMoney(need)}`, now: fmtMoney(currentARR()) },
    { ok: S.turn >= minTurn, text: `At least ${Math.round(minTurn / 4)} years of operating history`, now: `${(S.turn / 4).toFixed(1)} years` },
    { ok: S.funding.raised.length >= 2, text: 'Institutional backing (Series A or later)', now: `${S.funding.raised.length} rounds raised` },
    { ok: arrGrowthYoY() > 0.1, text: 'Growing more than 10% a year', now: `${Math.round(arrGrowthYoY() * 100)}% YoY` },
  ];
  return { ok: checks.every((c) => c.ok), checks, need };
}

// ---------- Recessions ----------
function scheduleRecessions() {
  const list = HOR().recessions; const n = list.length; const seg = S.totalTurns / n;
  S.recessions = list.map((r, i) => {
    const start = Math.max(6, Math.round(seg * i + rr(0.3, 0.7) * seg));
    const dur = Math.round(rr(3, 4 + 2 * r.sev));
    return { start, end: Math.min(S.totalTurns, start + dur), sev: r.sev, announced: false, ended: false };
  });
}

// ---------- New game ----------
function newGame(opts) {
  if (opts.seed != null) setSeed(opts.seed);
  const h = HORIZONS[opts.horizon];
  S = {
    company: (opts.company || '').trim() || 'Untitled Co.', industry: opts.industry, difficulty: opts.difficulty, horizon: opts.horizon,
    turn: 0, totalTurns: h.turns, cash: DIFFICULTY[opts.difficulty].cash, marketingSpend: 15000,
    markets: CURATED_MARKETS.map((d, i) => makeMarket(d, i)),
    employees: [], former: [], nextId: 1, recentFirst: [], recentLast: [], usedNames: [],
    product: { level: 1, points: 0, shipped: [] },
    sentiment: 1, valuation: 0, founderOwnership: 1, capTable: [],
    funding: { next: 0, raised: [], cooldownUntil: 0, announced: {} },
    rival: { name: '', strength: 0, alumni: [], pending: [] },
    recessions: [], history: [], log: [], events: [], modalQueue: [], newsQueue: [],
    qOneTime: 0, qOneTimeItems: [], last: null, scoutCount: 0, clapsUsed: 0, bridgeUsed: false,
    acqCooldownUntil: 4, gameOver: null, offersDeclined: [],
    stats: { hires: 0, fires: 0, resigned: 0, retained: 0, lostNegotiations: 0, transfers: 0, reassigns: 0, bonuses: 0, claps: 0,
      marketsEntered: 0, raised: 0, ships: 0, toRival: 0, walkedAway: 0, peakARR: 0, peakValuation: 0, calcified: 0 },
  };
  S.rival.name = `${pick(RIVAL_A)} ${pick(RIVAL_B)}`;
  scheduleRecessions();
  // Founding team: two engineers and one sales rep.
  ['eng', 'eng', 'sales'].forEach((d) => S.employees.push(makeEmployee(d)));
  S.valuation = computeValuation();
  S.history.push(snapshot());
  news(`${S.company} is open for business. Three people, ${fmtMoney(S.cash)} in the bank, and an MVP. ${S.rival.name} is already in the space.`, 'info');
  return S;
}
function snapshot() {
  return { turn: S.turn, arr: currentARR(), cash: S.cash, customers: totalCustomers(), valuation: S.valuation, revenue: totalRevenue(), net: S.last ? S.last.net : 0, head: S.employees.length };
}

// ---------- The quarter ----------
function advanceQuarter() {
  if (!S || S.gameOver || S.modalQueue.length) return false;
  const ind = IND(), dif = DIF();
  const rec = recessionNow(); const sev = rec ? rec.sev : 0;
  const level = S.product.level;

  // 1. Effective output of every person this quarter
  const outs = new Map(S.employees.map((e) => [e.id, empOutput(e)]));
  const deptOut = (d) => sum(S.employees.filter((e) => e.dept === d), (e) => outs.get(e.id));
  const engOut = deptOut('eng'), mktOut = deptOut('mkt'), opsOut = deptOut('ops');

  // 2. Customer acquisition (marketing + sales), 3. churn, 4. revenue, per market
  const entered = enteredMarkets();
  const weights = entered.map((m) => m.size * m.growth);
  const wsum = sum(weights);
  const mktTeam = Math.min(1.8, 1 + 0.12 * Math.pow(mktOut, 0.6));
  const baseCAC = ind.cac * dif.cac * Math.pow(productArpuMult(level), 0.8) * (1 + 0.45 * sev) * (1 + S.rival.strength) / mktTeam;
  const stageCap = 1 + 0.05 * (level - 1);
  const custStart = totalCustomers();
  const coverage = (opsOut * ind.supportCap + ind.supportCap * 0.6) / Math.max(1, custStart);
  const supportF = 1.2 - 0.35 * Math.min(1, coverage);
  const churnM = ind.churn * dif.churn * productChurnMult(level) * supportF * (1 + 0.3 * sev);
  let newMkt = 0, newSales = 0, churnedAll = 0;
  entered.forEach((m, i) => {
    const spendM = wsum > 0 ? S.marketingSpend * weights[i] / wsum : 0;
    const cap = 250000 * m.size * m.growth * stageCap;
    const eff = 1 / (1 + spendM / cap);
    const headroom = Math.max(0, 1 - penetration(m));
    const nm = spendM * eff * m.growth * marketRamp(m) * headroom / (baseCAC * Math.pow(m.arpu, 0.3));
    const reps = S.employees.filter((e) => e.dept === 'sales' && e.market === m.id);
    const sat = 1 / (1 + 0.05 * Math.max(0, reps.length - 1) / m.size);
    let ns = 0;
    reps.forEach((e) => { ns += headroom * ind.salesDeals * (1 - 0.3 * sev) * outs.get(e.id) * Math.sqrt(m.growth) * marketRamp(m) * sat; });
    const rate = 1 - Math.pow(1 - churnM * marketChurnMult(m), 3);
    const churned = m.customers * rate + (nm + ns) * rate * 0.5;
    m.customers = Math.max(0, m.customers + nm + ns - churned);
    m.revenue = m.customers * marketARPU(m) * 3;
    m.newCust = nm + ns; m.churned = churned; m.lastSpend = spendM;
    m.cac = nm > 0 ? spendM / nm : 0;
    m.hist.push(m.revenue); if (m.hist.length > 16) m.hist.shift();
    m.profitHist.push(m.revenue * ind.margin - m.overhead * dif.overhead - spendM - sum(reps, (e) => e.salary / 4));
    if (m.profitHist.length > 8) m.profitHist.shift();
    newMkt += nm; newSales += ns; churnedAll += churned;
  });

  // 5. P&L
  const revenue = totalRevenue();
  const cogs = revenue * (1 - ind.margin);
  const gp = revenue - cogs;
  const payroll = payrollQ();
  const overhead = overheadQ();
  const marketing = S.marketingSpend;
  const net = gp - payroll - overhead - marketing;
  S.cash += net;
  S.last = { revenue, cogs, gp, payroll, overhead, marketing, net, oneTime: S.qOneTime, oneTimeItems: S.qOneTimeItems.slice(),
    newMkt, newSales, churned: churnedAll, churnRate: churnM, supportF, coverage, cac: newMkt > 0 ? marketing / newMkt : 0,
    engOut, mktOut, opsOut, strain: opsStrain() };
  S.qOneTime = 0; S.qOneTimeItems = [];

  // 6. Product progress
  S.product.points += engOut + 0.3;

  // 7. Sentiment & valuation
  S.sentiment = clamp(S.sentiment + rr(-0.07, 0.07) + (1 - S.sentiment) * 0.15 - sev * 0.04, 0.6, 1.4);
  S.valuation = computeValuation();
  S.stats.peakARR = Math.max(S.stats.peakARR, currentARR());
  S.stats.peakValuation = Math.max(S.stats.peakValuation, S.valuation);

  // 8. People
  // Unanswered transfer requests lapse; overlooked cards stay while the rough patch lasts.
  S.events = S.events.filter((ev) => { const e = empById(ev.empId); return ev.type === 'overlooked' && e && e.temp && e.temp.reason === 'feeling overlooked'; });
  S.employees.forEach((e) => { if (e.request) { e.request = null; e.grievance = Math.min(20, e.grievance + 4); addHistory(e, 'Transfer request went unanswered'); } });
  employeesQuarter();

  // 9. The world
  S.turn++;
  S.clapsUsed = 0;
  worldQuarter();
  S.history.push(snapshot());

  // 10. End conditions
  if (S.cash < 0) {
    if (S.turn >= S.totalTurns || S.bridgeUsed) { endGame('bankrupt'); return true; }
    S.modalQueue.unshift({ type: 'bridge' });
  } else if (S.turn >= S.totalTurns) { endGame('time'); return true; }
  return true;
}

function employeesQuarter() {
  const leaving = [];
  S.employees.forEach((e) => {
    if (e.dip > 0) e.dip--;
    e.grievance = Math.max(0, e.grievance - 1);
    // Reveal the baseline after their first quarter (or first quarter after a move)
    if (!e.revealed) {
      e.revealed = true;
      const t = TIER_INFO[e.tier].label;
      if (e.prevTier) {
        const better = tierIdx(e.tier) < tierIdx(e.prevTier), worse = tierIdx(e.tier) > tierIdx(e.prevTier);
        addHistory(e, `Settled into ${DEPTS[e.dept].short} as ${t}`);
        news(`${e.name} has settled into ${DEPTS[e.dept].name}: ${better ? 'the move unlocked something. Now ' + t + '.' : worse ? 'it hasn’t clicked. Now ' + t + '.' : 'same as before, ' + t + '.'}`, better ? 'good' : worse ? 'bad' : 'team');
        e.prevTier = null;
      } else {
        addHistory(e, `First quarter in: ${t}`);
        if (e.tier === 'star' || e.tier === 'under') news(`${e.name}'s first quarter is in. ${e.tier === 'star' ? 'A genuine Star. Keep them happy.' : 'An Underperformer, so far. Coaching or a move might help.'}`, e.tier === 'star' ? 'good' : 'bad');
      }
      return;
    }
    // Temporary states run their course; rarely they calcify into a real shift.
    if (e.temp) {
      e.temp.left--;
      if (e.temp.left <= 0) {
        const t = e.temp; e.temp = null;
        if (t.type === 'rough' && chance(CALCIFY_CHANCE) && e.tier !== 'under') {
          e.tier = TIERS[tierIdx(e.tier) + 1]; S.stats.calcified++;
          addHistory(e, `Rough patch stuck: now ${TIER_INFO[e.tier].label}`);
          news(`${e.name}'s rough patch didn't lift. It looks like a lasting change: now ${TIER_INFO[e.tier].label}.`, 'bad');
        } else if (t.type === 'hot' && chance(CALCIFY_CHANCE) && e.tier !== 'star') {
          e.tier = TIERS[tierIdx(e.tier) - 1]; S.stats.calcified++;
          addHistory(e, `Hot streak stuck: now ${TIER_INFO[e.tier].label}`);
          news(`${e.name}'s hot streak turned out to be real growth: now ${TIER_INFO[e.tier].label}.`, 'good');
        } else if (t.type !== 'motivated') addHistory(e, t.type === 'rough' ? 'Out of the rough patch' : 'Hot streak cooled off');
      }
    } else {
      const r = rand();
      const since = quartersSinceRecog(e);
      if (r < TEMP_ODDS.rough) {
        e.temp = { type: 'rough', left: ri(1, 3), reason: pick(['a hard stretch at home', 'burnout', 'a project that went sideways', 'a clash with a teammate']) };
        addHistory(e, `Rough patch (${e.temp.reason})`);
        news(`${e.name} has hit a rough patch: ${e.temp.reason}.`, 'bad');
      } else if (r < TEMP_ODDS.rough + TEMP_ODDS.hot) {
        e.temp = { type: 'hot', left: ri(1, 3), reason: pick(['in the zone', 'a breakthrough idea', 'a great new mentor']) };
        addHistory(e, `Hot streak (${e.temp.reason})`);
        news(`${e.name} is on a hot streak: ${e.temp.reason}.`, 'good');
      } else if (since >= 5 && chance(Math.min(0.25, 0.04 * (since - 4)))) {
        e.temp = { type: 'rough', left: ri(2, 3), reason: 'feeling overlooked' };
        addHistory(e, 'Rough patch: feeling overlooked');
        S.events.push({ type: 'overlooked', empId: e.id, turn: S.turn });
      }
    }
    // Resignations
    if (tenure(e) >= 2) {
      const risk = flightRisk(e);
      const p = Math.max(0, risk - 20) / 100 * 0.35;
      if (chance(p)) leaving.push(e);
    }
    // Transfer requests (biased toward the skill's department)
    if (!e.request && tenure(e) >= 3 && S.turn - e.deptSince >= 3 && chance(0.03)) {
      const skillDept = SKILLS[e.skill].dept;
      const to = skillDept !== e.dept && chance(0.65) ? skillDept : pick(DEPT_KEYS.filter((d) => d !== e.dept));
      e.request = to;
      S.events.push({ type: 'transfer', empId: e.id, to, turn: S.turn });
      addHistory(e, `Asked to move to ${DEPTS[to].short}`);
    }
  });
  let talks = 0;
  leaving.sort((a, b) => tierIdx(a.tier) - tierIdx(b.tier)).forEach((e) => {
    if (e.tier === 'star' || e.tier === 'strong') {
      if (talks++ >= 2) { e.grievance = Math.min(20, e.grievance + 2); return; }
      const dest = chance(0.45) ? S.rival.name : pick(OTHER_EMPLOYERS);
      S.modalQueue.push({ type: 'retain', empId: e.id, dest });
    } else {
      S.stats.resigned++;
      news(`${e.name} (${TIER_INFO[e.tier].label}, ${DEPTS[e.dept].name}) has resigned. ${quartersSinceRecog(e) >= 5 ? 'They said nobody noticed their work.' : 'They wanted a change of scene.'}`, 'depart');
      removeEmployee(e, 'resigned');
    }
  });
}

function retainOptions(e) {
  const since = quartersSinceRecog(e);
  const adj = (e.tier === 'star' ? -0.08 : 0) + (since > 8 ? -0.08 : 0) + (tenure(e) > 12 ? 0.05 : 0) - e.grievance / 200;
  const mk = (key, label, raise, oneTime, base) => ({ key, label, raise, oneTime, cost: Math.round(e.salary * raise / 1000) * 1000, oneTimeCost: Math.round(e.salary * oneTime / 1000) * 1000, p: clamp(base + adj, 0.05, 0.97) });
  return [mk('low', 'Lowball', 0.07, 0, 0.38), mk('fair', 'Fair', 0.15, 0, 0.66), mk('gen', 'Generous', 0.25, 0.1, 0.88)];
}
const RETAIN_YES = ['felt genuinely valued by the raise', 'realized they were not done building here', 'said the counter showed we were serious', 'talked it over at home and decided to stay'];
const RETAIN_NO = ['the new role was too exciting to pass up', 'said the offer came too late', 'felt the counter didn’t match what they bring', 'had already made up their mind'];
function resolveRetain(e, opt, dest) {
  if (opt) spend(opt.oneTimeCost, `Retention bonus for ${e.name}`);
  if (opt && chance(opt.p)) {
    e.salary += opt.cost; e.lastRaiseTurn = S.turn; e.lastRecog = S.turn; e.grievance = 0;
    if (opt.key === 'gen') e.temp = { type: 'motivated', left: 2, reason: 'retention' };
    S.stats.retained++;
    addHistory(e, `Stayed after a ${opt.label.toLowerCase()} counter (+${fmtMoney(opt.cost)}/yr)`);
    const msg = `${e.name} is staying. They ${pick(RETAIN_YES)}.`;
    news(msg, 'good');
    return { ok: true, msg };
  }
  S.stats.resigned++;
  if (opt) S.stats.lostNegotiations++;
  const msg = opt ? `${e.name} is leaving for ${dest}. ${pick(RETAIN_NO).replace(/^./, (c) => c.toUpperCase())}.` : `${e.name} is leaving for ${dest}. You didn't counter.`;
  news(msg, 'depart');
  removeEmployee(e, 'resigned');
  return { ok: false, msg };
}

function worldQuarter() {
  // Recessions start and end
  S.recessions.forEach((r) => {
    if (!r.announced && S.turn >= r.start) { r.announced = true; news(r.sev >= 0.8 ? 'A full-blown recession. Budgets are frozen, buyers are cautious, and investors want profits.' : 'The economy is wobbling. Deals take longer and customers are watching spend.', 'recession'); }
    if (r.announced && !r.ended && S.turn >= r.end) { r.ended = true; news('The downturn is over. Buyers are back and investors are taking meetings again.', 'good'); }
  });
  // Rival alumni news
  S.rival.pending = S.rival.pending.filter((p) => {
    if (p.turn > S.turn) return true;
    if (chance(0.7)) news(pick([`${p.name} is reportedly running ${DEPTS[p.dept].name} at ${S.rival.name} now. Their last launch got good press.`, `${S.rival.name} landed a big partnership this quarter. Insiders credit ${p.name}.`, `Industry chatter says ${p.name} has made ${S.rival.name} noticeably sharper.`]), 'rival');
    else { S.rival.strength = Math.max(0, S.rival.strength - 0.01); news(`Word is ${p.name} is already restless at ${S.rival.name}. The grass wasn't greener.`, 'rival'); }
    return false;
  });
  // Funding round opens
  const fs = roundStatus();
  if (fs.state === 'open' && !S.funding.announced[fs.r.key]) { S.funding.announced[fs.r.key] = true; news(`Investors are circling. A ${fs.r.name} round is now open to you on the Funding tab.`, 'funding'); }
  // Acquisition offers
  if (S.turn >= S.acqCooldownUntil && S.turn < S.totalTurns && currentARR() > 0) {
    const p = HOR().acqRate * (currentARR() > 500000 ? 1 : 0.3);
    if (chance(p)) {
      const rec = recessionNow();
      const offer = S.valuation * rr(0.85, 1.55) * HOR().acqPremium * (rec ? 0.8 : 1);
      S.modalQueue.push({ type: 'acquisition', buyer: pick(ACQUIRERS), offer });
      S.acqCooldownUntil = S.turn + 4;
    }
  }
}

function acquisitionVerdict(offer) {
  const h = S.history; const n = Math.min(4, h.length - 1);
  let qg = 0;
  if (n > 0 && h[h.length - 1 - n].arr > 0) qg = Math.pow(h[h.length - 1].arr / h[h.length - 1 - n].arr, 1 / n) - 1;
  qg = clamp(qg, -0.1, 0.25);
  const horizon = Math.min(12, S.totalTurns - S.turn);
  const projected = S.valuation * Math.pow(1 + qg, horizon) * 0.75;
  let key, text;
  if (offer >= projected) { key = 'great'; text = `Sold at the right time. At your recent growth rate (${(qg * 100).toFixed(1)}% a quarter), the company would likely have been worth about ${fmtMoney(projected)} after risk in ${horizon} quarters. The offer beat that.`; }
  else if (offer >= projected * 0.7) { key = 'ok'; text = `A defensible exit. Staying the course pointed to roughly ${fmtMoney(projected)} after risk, so you left some upside on the table, but you also skipped the risk of getting there.`; }
  else { key = 'early'; text = `Probably early. Growth of ${(qg * 100).toFixed(1)}% a quarter pointed to roughly ${fmtMoney(projected)} within ${horizon} quarters, well above the offer.`; }
  return { key, text, projected, qg };
}

function endGame(kind, extra = {}) {
  S.gameOver = { kind, turn: S.turn, ...extra };
  S.modalQueue = [];
}

function shipProduct() {
  const cost = shipCost(), cash = shipCash();
  if (S.product.points < cost) return false;
  S.product.points -= cost;
  spend(cash, `Launching v${S.product.level + 1}`);
  const before = stageFor(S.product.level).cur.name;
  S.product.level++;
  const code = CODENAMES[(S.product.level - 2) % CODENAMES.length];
  S.product.shipped.push({ level: S.product.level, turn: S.turn, code });
  S.stats.ships++;
  const after = stageFor(S.product.level).cur.name;
  news(`v${S.product.level} "${code}" ships. Prices can rise a little and customers have fewer reasons to leave.${after !== before ? ` The product is now ${after}.` : ''}`, 'product');
  return true;
}

// ---------- Formatting ----------
function fmtMoney(n, opts = {}) {
  if (n == null || !isFinite(n)) return '—';
  const neg = n < 0, a = Math.abs(n); let s;
  if (a >= 1e9) s = (a / 1e9).toFixed(a >= 1e11 ? 0 : a >= 1e10 ? 1 : 2) + 'B';
  else if (a >= 1e6) s = (a / 1e6).toFixed(a >= 1e8 ? 0 : a >= 1e7 ? 1 : 2) + 'M';
  else if (a >= 1e4) s = Math.round(a / 1e3) + 'k';
  else if (a >= 1e3) s = (a / 1e3).toFixed(1).replace(/\.0$/, '') + 'k';
  else s = String(Math.round(a));
  return (neg ? '−' : opts.sign ? '+' : '') + '$' + s;
}
function fmtNum(n) {
  if (!isFinite(n)) return '—';
  const a = Math.abs(n);
  if (a >= 1e6) return (n / 1e6).toFixed(a >= 1e7 ? 1 : 2) + 'M';
  if (a >= 1e4) return (n / 1e3).toFixed(1) + 'k';
  return Math.round(n).toLocaleString('en-US');
}
const fmtPct = (x, d = 1) => (x * 100).toFixed(d).replace(/\.0+$/, '') + '%';
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmtTenure = (q) => (q < 4 ? `${q}q` : `${Math.floor(q / 4)}y${q % 4 ? ' ' + (q % 4) + 'q' : ''}`);
const fmtRunway = (m) => (m === Infinity ? 'Profitable' : m >= 120 ? '10+ yrs' : m >= 24 ? (m / 12).toFixed(1) + ' yrs' : m.toFixed(1) + ' mo');
const clockLabel = (turn) => `Year ${yearOf(turn)} · Q${quarterOf(turn)}`;

// ---------- Charts ----------
function lineChart(series, { w = 560, h = 170, fmt = fmtMoney } = {}) {
  const n = Math.max(...series.map((s) => s.values.length));
  if (n < 2) return `<div class="chart-empty">This chart fills in after your first quarter.</div>`;
  const pad = { l: 54, r: 14, t: 12, b: 24 };
  const all = series.flatMap((s) => s.values);
  let lo = Math.min(0, ...all), hi = Math.max(...all);
  if (hi - lo < 1) hi = lo + 1;
  const X = (i) => pad.l + (w - pad.l - pad.r) * (i / (n - 1));
  const Y = (v) => pad.t + (h - pad.t - pad.b) * (1 - (v - lo) / (hi - lo));
  let g = '';
  const ticks = lo < 0 ? [lo, 0, hi] : [0, hi / 2, hi];
  ticks.forEach((t) => { g += `<line x1="${pad.l}" x2="${w - pad.r}" y1="${Y(t)}" y2="${Y(t)}" class="grid${t === 0 ? ' zero' : ''}"/><text x="${pad.l - 8}" y="${Y(t) + 4}" text-anchor="end" class="tick">${fmt(t)}</text>`; });
  const years = Math.ceil(n / 4); const step = Math.max(1, Math.ceil(years / 8)) * 4;
  for (let i = 0; i < n; i += step) g += `<text x="${X(i)}" y="${h - 6}" text-anchor="middle" class="tick">Y${yearOf(i)}</text>`;
  S.recessions.forEach((r) => {
    if (!r.announced) return;
    const a = Math.min(r.start, n - 1), b = Math.min(r.end, n - 1);
    if (b > a) g += `<rect x="${X(a)}" y="${pad.t}" width="${X(b) - X(a)}" height="${h - pad.t - pad.b}" class="rec-band"/>`;
  });
  series.forEach((s, si) => {
    const pts = s.values.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`);
    if (si === 0) g += `<path d="M${X(0)},${Y(Math.max(lo, 0))} L${pts.join(' L')} L${X(s.values.length - 1)},${Y(Math.max(lo, 0))} Z" class="area" style="fill:${s.color}"/>`;
    g += `<path d="M${pts.join(' L')}" class="line" style="stroke:${s.color}"/>`;
    const li = s.values.length - 1;
    g += `<circle cx="${X(li)}" cy="${Y(s.values[li])}" r="3.5" style="fill:${s.color}" class="dot"/>`;
  });
  return `<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(series.map((s) => s.label).join(' and '))} over time">${g}</svg>`;
}
function sparkline(values, w = 90, h = 22) {
  if (values.length < 2) return `<span class="spark-empty">—</span>`;
  const lo = Math.min(...values), hi = Math.max(...values, lo + 1);
  const pts = values.map((v, i) => `${(i / (values.length - 1) * (w - 4) + 2).toFixed(1)},${(h - 3 - (v - lo) / (hi - lo) * (h - 6)).toFixed(1)}`);
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true"><path d="M${pts.join(' L')}"/></svg>`;
}

// ---------- Setup screen ----------
function setupRunway(industry, difficulty) {
  // Real computation of the founding team's burn vs starting cash, before any revenue.
  const d = DIFFICULTY[difficulty], ind = INDUSTRIES[industry];
  const payroll = (DEPTS.eng.salary * 2 + DEPTS.sales.salary) * d.salary / 4;
  const overhead = (18000 + 5000 * 3 + ind.compliance) * d.overhead;
  const burn = payroll + overhead + 15000;
  return { burn, months: d.cash / (burn / 3), cash: d.cash };
}

  const who = `<strong>${esc(e.name)}</strong> (${e.revealed ? TIER_INFO[e.tier].label : 'unproven'}, ${DEPTS[e.dept].name})`;
  if (ev.type === 'overlooked') {
    const canClap = S.clapsUsed < clapBudget() && S.turn >= e.clapReadyTurn, canBonus = S.turn >= e.bonusReadyTurn;
    return `<div class="event warn"><div class="event-kind">Feeling overlooked</div>
      <p>${who} hasn't been recognized in ${quartersSinceRecog(e)} quarters and has hit a rough patch. They feel their work goes unnoticed.</p>
      <div class="event-actions"><button class="btn" data-act="bonus" data-id="${e.id}" ${canBonus ? '' : 'disabled'}>Bonus · ${fmtMoney(bonusCost(e))}</button><button class="btn ghost" data-act="clap" data-id="${e.id}" ${canClap ? '' : 'disabled'}>Clap${canClap ? '' : ' (used)'}</button><span class="event-note">A bonus usually pulls people out of it. A clap sometimes does.</span></div></div>`;
  }
  if (ev.type === 'transfer') {
    const o = transferOdds(e, ev.to);
    return `<div class="event"><div class="event-kind">Transfer request</div>
      <p>${who} asks to move to <strong>${DEPTS[ev.to].name}</strong>. ${o.fit ? `It matches their ${e.skill} skill.` : `Their ${e.skill} skill fits ${DEPTS[SKILLS[e.skill].dept].name} better.`} Their track record suggests about <strong>${Math.round(o.good * 100)}%</strong> odds it works out. Ignoring the request will sting.</p>
      <div class="event-actions"><button class="btn" data-act="approve-request" data-id="${e.id}">Approve the move</button><button class="btn ghost" data-act="decline-request" data-id="${e.id}">Decline</button></div></div>`;
  }
  return '';
}
function statementRows() {
  const L = S.last;
  const row = (label, v, cls = '') => `<tr class="${cls}"><th scope="row">${label}</th><td>${fmtMoney(v)}</td></tr>`;
  return row('Revenue', L.revenue) + row('Cost of revenue', -L.cogs) + row('Gross profit', L.gp, 'sub') +
    row('Payroll', -L.payroll) + row('Overhead', -L.overhead) + row('Marketing', -L.marketing) +
    row('Operating result', L.net, 'total' + (L.net < 0 ? ' neg' : '')) +
    (L.oneTime ? row('One-time spend (hires, launches, entries)', -L.oneTime) : '') +
    row('Change in cash', L.net - L.oneTime, 'sub');
}

// ---------- Team ----------
function tierPill(e) {
  if (!e.revealed) return `<span class="pill unknown" title="Their baseline is hidden until a full quarter is in">${e.prevTier ? 'Settling in' : 'Onboarding'}</span>`;
  return `<span class="pill tier-${e.tier}">${TIER_INFO[e.tier].label}</span>`;
}
function tempChip(e) {
  if (!e.temp) return '';
  const t = e.temp; const cls = t.type === 'rough' ? 'bad' : 'good';
  return `<span class="pill ${cls}" title="${esc(t.reason)}">${TEMP_INFO[t.type].label}${t.reason === 'feeling overlooked' ? ': overlooked' : ''} · ${t.left}q</span>`;
}
function empCard(e) {

      ${pm != null && pm !== e.market ? (() => { const f = traitFitText(e, pm); return `<div class="confirm-row ${f.ok ? '' : 'risky'}"><p>${f.text} Expect a one-quarter adjustment dip.</p><button class="btn small" data-act="market-confirm" data-id="${e.id}">Reassign</button><button class="btn small ghost" data-act="market-cancel" data-id="${e.id}">Cancel</button></div>`; })() : ''}</div>`;
  }

    </div>

// ---------- Product ----------

  const ind = IND();
  return `
  <div class="ov-grid">

        <div class="ph-version"><span class="ph-v">v${lvl}</span><span class="ph-stage">${cur.name}</span></div>

        <p class="fine">${next ? `${next.at - lvl} more release${next.at - lvl > 1 ? 's' : ''} to ${next.name}.` : ''} There is no final version. Keep shipping.</p>

}

function bridgeAmount() { return Math.round((-S.cash + Math.max(150000, -projectedNet() * 2)) / 10000) * 10000; }

function renderModal() {
  const root = $('#modal-root');
  const m = S && UI.screen === 'game' ? S.modalQueue[0] : null;
  const btn = $('#advance-btn');
  if (btn) btn.disabled = advanceDisabled();
  if (!m) { root.innerHTML = ''; root.hidden = true; document.body.classList.remove('modal-open'); return; }
  root.hidden = false;
  document.body.classList.add('modal-open');
  root.innerHTML = `<div class="backdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">${MODALS[m.type].render(m)}</div></div>`;
  if (MODALS[m.type].mount) MODALS[m.type].mount(m);
  const first = root.querySelector('.modal-actions .btn.primary, .modal .btn');
  if (first) first.focus({ preventScroll: true });
}
function pushModal(m) { S.modalQueue.push(m); }
function replaceModal(m) { S.modalQueue[0] = m; }
function closeModal() { S.modalQueue.shift(); }

function openFunding() {
  const fs = roundStatus(); if (fs.state !== 'open') return;
  const terms = fundingTerms(fs.r);
  S.modalQueue.unshift({ type: 'funding', roundIdx: S.funding.next, terms, eq: Math.round(terms.fair * 200) / 200 });
}
function updateFundingQuote(m) {
  const q = fundingQuote(m.terms, m.eq);
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.textContent = v; };
  set('fq-eq', fmtPct(m.eq));
  set('fq-cash', fmtMoney(q.cash));
  set('fq-post', fmtMoney(q.post));
  set('fq-own', `${fmtPct(S.founderOwnership)} → ${fmtPct(q.ownerAfter)}`);
  const t = m.terms; const note = document.getElementById('fq-note');
  if (note) {
    if (m.eq < t.fair * 0.85) { note.textContent = 'An aggressive ask. Investors may push back with a counter-offer.'; note.className = 'fq-note warn'; }
    else if (m.eq > t.fair * 1.25) { note.textContent = 'Generous. They will sign today, but you are giving away more than you need to.'; note.className = 'fq-note'; }
    else { note.textContent = 'Within the range investors expect. This should close cleanly.'; note.className = 'fq-note ok'; }
  }
}
function submitFundingOffer(m) {
  const r = ROUNDS[m.roundIdx], t = m.terms, e = m.eq, q = fundingQuote(t, e);
  const thr = t.fair * 0.85;
  if (e >= thr) { closeModal(); closeRound(r, e, q.cash); toast(`${r.name} closed: ${fmtMoney(q.cash)} for ${fmtPct(e)}.`, 'good'); return; }
  const p = clamp(0.4 + ((thr - e) / t.fair) * 2.5, 0, 0.95);
  if (chance(p)) {
    const theirEq = q.cash / (t.preBasis + q.cash);
    const midEq = (e + theirEq) / 2;
    replaceModal({ type: 'counter', roundIdx: m.roundIdx, terms: t, askEq: e, cash: q.cash, theirEq, midEq, midP: clamp(0.55 + (S.sentiment - 1) * 0.8, 0.3, 0.8), investor: pick(INVESTORS[r.key]) });
  } else {
    closeModal(); closeRound(r, e, q.cash); toast(`A bold ask, and they took it: ${fmtMoney(q.cash)} for ${fmtPct(e)}.`, 'good');
  }
}

// ---------- Advisor ----------
function advisorTips() {
  const tips = []; const add = (p, text, tab) => tips.push({ p, text, tab });
  const rw = runwayMonths(); const rec = recessionNow(); const L = S.last;
  if (rw < 6) add(100, `Runway is down to ${fmtRunway(rw)}. Cut marketing, pause hiring, or raise money now.`, rw < 6 && roundStatus().state === 'open' ? 'funding' : 'overview');
  else if (rw < 12) add(70, `About ${fmtRunway(rw)} of runway. Start planning the next raise before you need it.`, 'funding');
  if (rec) add(80, `We're in a downturn. Acquisition costs are up about ${Math.round(45 * rec.sev)}% and valuations are down. Protect cash; the good news is it will end.`, null);
  if (ipoStatus().ok) add(95, `You meet every IPO requirement. Ring the bell on the Funding tab, or keep growing for a bigger debut.`, 'funding');
  const risky = S.employees.filter((e) => e.revealed && (e.tier === 'star' || e.tier === 'strong') && flightRisk(e) >= 30).sort((a, b) => flightRisk(b) - flightRisk(a));
  risky.slice(0, 2).forEach((e) => add(85, `${e.name} (${TIER_INFO[e.tier].label}, ${DEPTS[e.dept].name}) hasn't been recognized in ${quartersSinceRecog(e)} quarters. Flight risk is ${riskLabel(flightRisk(e)).toLowerCase()}. A bonus or a clap would help.`, 'team'));
  S.events.filter((ev) => ev.type === 'overlooked').slice(0, 1).forEach((ev) => { const e = empById(ev.empId); if (e) add(75, `${e.name} is in a rough patch because they feel overlooked. A bonus usually pulls people out of it.`, 'overview'); });
  S.events.filter((ev) => ev.type === 'transfer').slice(0, 1).forEach((ev) => { const e = empById(ev.empId); if (e) add(55, `${e.first} asked to move to ${DEPTS[ev.to].name}. Answer before next quarter or they'll take the silence personally.`, 'overview'); });
  const fs = roundStatus(); if (fs.state === 'open') add(65, `The ${fs.r.name} round is open. Investor sentiment is ${S.sentiment >= 1.1 ? 'warm, a good moment' : S.sentiment <= 0.9 ? 'cool, so expect to give up more' : 'neutral'}.`, 'funding');
  enteredMarkets().filter((m) => !m.home && marketStatus(m).key === 'bad').slice(0, 1).forEach((m) => add(58, `${m.name} has lost money three quarters running. Put a rep there whose trait fits, or accept it as a long bet.`, 'markets'));
  if (S.product.points >= shipCost()) add(60, `Engineering has enough built to ship v${S.product.level + 1}. Shipping raises prices and lowers churn.`, 'product');
  if (L && L.coverage < 0.7) add(57, `Support is stretched to ${Math.round(L.coverage * 100)}% of what customers need, and churn is creeping up. An Operations hire would help.`, 'team');
  if (opsStrain() > 1.1) add(50, `The team has outgrown its operations. Overhead is running ${Math.round((opsStrain() - 1) * 100)}% high until you add Ops capacity.`, 'team');
  const saturated = enteredMarkets().filter((m) => penetration(m) > 0.55).sort((a, b) => penetration(b) - penetration(a))[0];
  if (saturated) add(52, `You've reached ${Math.round(penetration(saturated) * 100)}% of the likely buyers in ${saturated.name}. Growth there will keep slowing; the next stretch comes from new markets or a better product.`, 'markets');
  const home = homeMarket();
  if (L && home.lastSpend > 350000 * home.size * home.growth * (1 + 0.12 * (S.product.level - 1)) * 0.6) add(45, `Marketing in ${home.name} is hitting diminishing returns. A new market would stretch each dollar further.`, 'markets');
  if (S.employees.filter((e) => e.dept === 'eng').length === 0) add(72, 'Nobody is building the product. Hire an engineer or two.', 'team');
  if (L && rw > 30 && S.marketingSpend < 50000 && S.turn > 2) add(40, `You have plenty of runway. Put some of it to work: more marketing or another rep.`, 'overview');
  if (S.rival.strength >= 0.08) add(35, `${S.rival.name} has gotten stronger with people who used to work here. Keeping your stars matters.`, 'team');
  // Praise, not just problems
  const h = S.history;
  if (h.length >= 2 && h[h.length - 2].arr > 50000) { const g = h[h.length - 1].arr / h[h.length - 2].arr - 1; if (g > 0.2) add(32, `ARR grew ${Math.round(g * 100)}% last quarter. That's a great quarter. Enjoy it.`, null); }
  if (L && L.net > 0) add(30, `You made an operating profit last quarter. Very few startups can say that.`, null);
  const stars = S.employees.filter((e) => e.revealed && e.tier === 'star').length;
  if (stars >= 3) add(25, `You have ${stars} Stars on the team. Whatever you're doing to keep them, keep doing it.`, 'team');
  if (!tips.length) add(10, `Nothing urgent. Good moment to think about where growth comes from next year.`, null);
  return tips.sort((a, b) => b.p - a.p).slice(0, 3).map((t) => ({ ...t, level: t.p >= 80 ? 'urgent' : t.p >= 50 ? 'warn' : t.p <= 35 ? 'praise' : 'info' }));
}
